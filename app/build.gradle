apply plugin: 'com.android.application'

android {
    defaultConfig {
        applicationId "com.lgh.tapclick"
        compileSdk 36
        minSdkVersion 24
        targetSdkVersion 36
        versionCode 106
        versionName "10.6"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        javaCompileOptions {
            annotationProcessorOptions {
                arguments = ["room.schemaLocation": "$projectDir/schemas".toString()]
            }
        }
    }
    signingConfigs {
        // 正式签名：CI 通过 GitHub Secrets 注入环境变量
        // KEYSTORE_FILE / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD
        release {
            def ksFile = System.getenv("KEYSTORE_FILE")
            def ksPass = System.getenv("KEYSTORE_PASSWORD")
            def kAlias = System.getenv("KEY_ALIAS")
            def kPass = System.getenv("KEY_PASSWORD")
            if (ksFile && ksPass && kAlias && kPass) {
                storeFile file(ksFile)
                storePassword ksPass
                keyAlias kAlias
                keyPassword kPass
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            buildConfigField("String", "BUILD_COMMIT", "\"" + (System.getenv("GITHUB_SHA") ?: "local") + "\"")
            def hasReleaseSigning = System.getenv("KEYSTORE_FILE") \
                    && System.getenv("KEYSTORE_PASSWORD") \
                    && System.getenv("KEY_ALIAS") \
                    && System.getenv("KEY_PASSWORD")
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            minifyEnabled false
            shrinkResources false
            buildConfigField("String", "BUILD_COMMIT", "\"" + (System.getenv("GITHUB_SHA") ?: "local") + "\"")
        }
    }
    buildFeatures {
        buildConfig true
        viewBinding true
    }
    compileOptions {
        targetCompatibility JavaVersion.VERSION_1_8
        sourceCompatibility JavaVersion.VERSION_1_8
    }
    lint {
        checkReleaseBuilds true
        abortOnError true
    }
    packagingOptions {
        exclude 'META-INF/INDEX.LIST'
    }
    namespace 'com.lgh.tapclick'
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.10.0'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'androidx.room:room-runtime:2.5.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'commons-io:commons-io:2.13.0'
    implementation 'cn.hutool:hutool-core:5.8.32'
    implementation 'cn.hutool:hutool-crypto:5.8.32'
    implementation 'com.github.tiann:FreeReflection:3.2.2'
    annotationProcessor 'androidx.room:room-compiler:2.5.1'
    androidTestImplementation 'androidx.test:runner:1.5.2'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    testImplementation 'junit:junit:4.13.2'
}

gradle.projectsEvaluated {
    tasks.withType(JavaCompile).tap {
        configureEach {
            Set<File> fileSet = options.bootstrapClasspath.getFiles()
            List<File> newFileList = new ArrayList<>()
            // 隐藏 API 仅供 javac 编译；不要声明为依赖，否则完整框架 jar 会污染 R8 的库输入。
            // 使用 projectDir 相对路径，兼容 Windows / Linux CI。
            newFileList.add(new File(project.projectDir, "libs/classes4-dex2jar.jar"))
            newFileList.addAll(fileSet)
            options.bootstrapClasspath = files(newFileList.toArray())
        }
    }
}
