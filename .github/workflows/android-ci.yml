name: Android CI

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  verify:
    name: Compile, test and lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
          gradle-home-cache-cleanup: true

      - name: Cache Android SDK
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ANDROID_HOME }}/platforms
            ${{ env.ANDROID_HOME }}/build-tools
            ${{ env.ANDROID_HOME }}/platform-tools
            ${{ env.ANDROID_HOME }}/licenses
            ${{ env.ANDROID_HOME }}/cmdline-tools
          key: android-sdk-api36-bt36-${{ runner.os }}-v1
          restore-keys: |
            android-sdk-api36-bt36-${{ runner.os }}-
            android-sdk-api36-

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: tools platform-tools platforms;android-36 build-tools;36.0.0

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Compile, run unit tests and lint
        run: |
          ./gradlew \
            :app:assembleDebug \
            :app:testDebugUnitTest \
            :app:lintDebug \
            :app:assembleRelease \
            --no-daemon \
            --stacktrace \
            --build-cache \
            -Dorg.gradle.jvmargs="-Xmx3072m -Dfile.encoding=UTF-8"

      - name: Upload verification APKs
        uses: actions/upload-artifact@v4
        with:
          name: TapClick-verification-apks
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload generated Room schemas
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: TapClick-room-schemas
          path: app/schemas/
          if-no-files-found: warn
          retention-days: 14

  release:
    name: Sign and publish universal APK
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: tools platform-tools platforms;android-36 build-tools;36.0.0

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Validate release metadata and signing secrets
        id: version
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          SIGNING_CERT_SHA256: ${{ secrets.SIGNING_CERT_SHA256 }}
        run: |
          for name in SIGNING_KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD SIGNING_CERT_SHA256; do
            if [ -z "${!name}" ]; then
              echo "Required release secret is missing: ${name}" >&2
              exit 1
            fi
          done
          VERSION_NAME=$(grep -E 'versionName\s+"' app/build.gradle | head -1 | sed -E 's/.*versionName[[:space:]]+"([^"]+)".*/\1/')
          VERSION_CODE=$(grep -E 'versionCode\s+' app/build.gradle | head -1 | sed -E 's/.*versionCode[[:space:]]+([0-9]+).*/\1/')
          if [ "${GITHUB_REF_NAME}" != "v${VERSION_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match versionName ${VERSION_NAME}" >&2
            exit 1
          fi
          echo "name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "${RUNNER_TEMP}/tapclick-release.jks"
          echo "KEYSTORE_FILE=${RUNNER_TEMP}/tapclick-release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease \
            --no-daemon \
            --stacktrace \
            --build-cache \
            -Dorg.gradle.jvmargs="-Xmx3072m -Dfile.encoding=UTF-8"

      - name: Verify signature and prepare release files
        id: dist
        env:
          SIGNING_CERT_SHA256: ${{ secrets.SIGNING_CERT_SHA256 }}
        run: |
          mkdir -p dist
          SRC=$(find app/build/outputs/apk/release -type f -name "*.apk" | head -1)
          if [ -z "$SRC" ]; then
            echo "No release APK found" >&2
            exit 1
          fi
          DEST="dist/TapClick-v${{ steps.version.outputs.name }}-universal.apk"
          cp "$SRC" "$DEST"
          APKSIGNER="${ANDROID_HOME}/build-tools/36.0.0/apksigner"
          "$APKSIGNER" verify --verbose --print-certs "$DEST"
          ACTUAL_CERT=$("$APKSIGNER" verify --print-certs "$DEST" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1 | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')
          EXPECTED_CERT=$(printf '%s' "$SIGNING_CERT_SHA256" | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')
          if [ -z "$ACTUAL_CERT" ] || [ "$ACTUAL_CERT" != "$EXPECTED_CERT" ]; then
            echo "Release signing certificate fingerprint mismatch" >&2
            exit 1
          fi
          sha256sum "$DEST" > "${DEST}.sha256"
          echo "apk=${DEST}" >> "$GITHUB_OUTPUT"

      - name: Upload signed release artifact
        uses: actions/upload-artifact@v4
        with:
          name: TapClick-release-universal
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: TapClick ${{ steps.version.outputs.name }}
          body: |
            ## TapClick ${{ steps.version.outputs.name }} (versionCode ${{ steps.version.outputs.code }})

            - APK: universal
            - Build: `${{ github.sha }}`
            - Signature and SHA-256 checksum verified by CI
          files: dist/*
          draft: false
          prerelease: false
          generate_release_notes: true
          make_latest: true
          fail_on_unmatched_files: true

      - name: Remove temporary keystore
        if: ${{ always() }}
        run: rm -f "${RUNNER_TEMP}/tapclick-release.jks"
