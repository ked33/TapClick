name: Android CI

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build arm64-v8a
    runs-on: ubuntu-latest

    env:
      TARGET_ABI: arm64-v8a
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
          gradle-home-cache-cleanup: true

      - name: Cache Android SDK
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ANDROID_HOME }}/platforms
            ${{ env.ANDROID_HOME }}/build-tools
            ${{ env.ANDROID_HOME }}/platform-tools
            ${{ env.ANDROID_HOME }}/licenses
            ${{ env.ANDROID_HOME }}/cmdline-tools
          key: android-sdk-api34-bt34-${{ runner.os }}-v1
          restore-keys: |
            android-sdk-api34-bt34-${{ runner.os }}-
            android-sdk-api34-

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: tools platform-tools platforms;android-34 build-tools;34.0.0

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode release keystore
        if: ${{ github.event_name != 'pull_request' }}
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "SIGNING_KEYSTORE_BASE64 secret is missing" >&2
            exit 1
          fi
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "${GITHUB_WORKSPACE}/tapclick-release.jks"
          echo "KEYSTORE_FILE=${GITHUB_WORKSPACE}/tapclick-release.jks" >> "$GITHUB_ENV"

      - name: Extract version
        id: version
        run: |
          VERSION_NAME=$(grep -E 'versionName\s+"' app/build.gradle | head -1 | sed -E 's/.*versionName[[:space:]]+"([^"]+)".*/\1/')
          VERSION_CODE=$(grep -E 'versionCode\s+' app/build.gradle | head -1 | sed -E 's/.*versionCode[[:space:]]+([0-9]+).*/\1/')
          echo "name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "Version name=${VERSION_NAME} code=${VERSION_CODE}"

      - name: Build Release APK (arm64-v8a only)
        env:
          KEYSTORE_FILE: ${{ env.KEYSTORE_FILE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease \
            --no-daemon \
            --stacktrace \
            --build-cache \
            -Dorg.gradle.jvmargs="-Xmx2048m -Dfile.encoding=UTF-8"

      - name: Prepare dist APK
        id: dist
        run: |
          mkdir -p dist
          SRC=$(find app/build/outputs/apk/release -type f -name "*.apk" | head -1)
          if [ -z "$SRC" ]; then
            echo "No APK found" >&2
            exit 1
          fi
          DEST="dist/TapClick-v${{ steps.version.outputs.name }}-${TARGET_ABI}.apk"
          cp "$SRC" "$DEST"
          echo "apk=${DEST}" >> "$GITHUB_OUTPUT"
          ls -lh dist/
          # 校验是否为正式签名（非 debug）
          $ANDROID_HOME/build-tools/34.0.0/apksigner verify --print-certs "$DEST" || true

      - name: Upload Release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TapClick-release-${{ env.TARGET_ABI }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: ${{ github.event_name != 'pull_request' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || steps.version.outputs.tag }}
          name: TapClick ${{ steps.version.outputs.name }}
          body: |
            ## TapClick ${{ steps.version.outputs.name }} (versionCode ${{ steps.version.outputs.code }})

            - ABI: **${{ env.TARGET_ABI }}** only
            - Build: `${{ github.sha }}`
            - Trigger: `${{ github.event_name }}` on `${{ github.ref_name }}`

            ### 安装
            下载下方 APK 直接安装（已使用 release 密钥签名）。
          files: dist/*.apk
          draft: false
          prerelease: false
          generate_release_notes: true
          make_latest: true
          fail_on_unmatched_files: true

      - name: Shred keystore
        if: ${{ always() && github.event_name != 'pull_request' }}
        run: |
          rm -f "${GITHUB_WORKSPACE}/tapclick-release.jks" || true
