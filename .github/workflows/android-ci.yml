name: Android CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build arm64-v8a
    runs-on: ubuntu-latest

    env:
      # 与 app/build.gradle 中 abiFilters 保持一致
      TARGET_ABI: arm64-v8a
      # GitHub-hosted runner 默认 Android SDK 路径
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Gradle 依赖 / wrapper / build-cache
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
          gradle-home-cache-cleanup: true

      # 先恢复 SDK 缓存，再安装缺失组件
      - name: Cache Android SDK
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ANDROID_HOME }}/platforms
            ${{ env.ANDROID_HOME }}/build-tools
            ${{ env.ANDROID_HOME }}/platform-tools
            ${{ env.ANDROID_HOME }}/licenses
            ${{ env.ANDROID_HOME }}/cmdline-tools
          key: android-sdk-api34-bt34-${{ runner.os }}-v1
          restore-keys: |
            android-sdk-api34-bt34-${{ runner.os }}-
            android-sdk-api34-

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: tools platform-tools platforms;android-34 build-tools;34.0.0

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK (arm64-v8a only)
        run: |
          ./gradlew :app:assembleRelease \
            --no-daemon \
            --stacktrace \
            --build-cache \
            -Dorg.gradle.jvmargs="-Xmx2048m -Dfile.encoding=UTF-8"

      - name: List APK outputs
        run: find app/build/outputs/apk -type f -name "*.apk" -print

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: TapClick-release-${{ env.TARGET_ABI }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
