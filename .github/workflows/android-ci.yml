name: Android CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  verify:
    name: Compile, test and lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
          gradle-home-cache-cleanup: true

      - name: Cache Android SDK
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ANDROID_HOME }}/platforms
            ${{ env.ANDROID_HOME }}/build-tools
            ${{ env.ANDROID_HOME }}/platform-tools
            ${{ env.ANDROID_HOME }}/licenses
            ${{ env.ANDROID_HOME }}/cmdline-tools
          key: android-sdk-api36-bt36-${{ runner.os }}-v1
          restore-keys: |
            android-sdk-api36-bt36-${{ runner.os }}-
            android-sdk-api36-

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: tools platform-tools platforms;android-36 build-tools;36.0.0

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Compile, run unit tests and lint
        run: |
          ./gradlew \
            :app:assembleDebug \
            :app:testDebugUnitTest \
            :app:lintDebug \
            :app:assembleRelease \
            --no-daemon \
            --stacktrace \
            --build-cache \
            -Dorg.gradle.jvmargs="-Xmx3072m -Dfile.encoding=UTF-8"

      - name: Upload generated Room schemas
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: TapClick-room-schemas
          path: app/schemas/
          if-no-files-found: warn
          retention-days: 14

  release:
    name: Sign and publish universal APK
    if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') }}
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: tools platform-tools platforms;android-36 build-tools;36.0.0

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Validate release metadata and signing secrets
        id: version
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          SIGNING_CERT_SHA256: ${{ secrets.SIGNING_CERT_SHA256 }}
        run: |
          for name in SIGNING_KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD SIGNING_CERT_SHA256; do
            if [ -z "${!name}" ]; then
              echo "Required release secret is missing: ${name}" >&2
              exit 1
            fi
          done
          BASE_VERSION_NAME=$(sed -nE 's/^def baseVersionName = "([^"]+)"/\1/p' app/build.gradle | head -1)
          BASE_VERSION_CODE=$(sed -nE 's/^def baseVersionCode = ([0-9]+)/\1/p' app/build.gradle | head -1)
          if ! [[ "$BASE_VERSION_CODE" =~ ^[0-9]+$ ]] || [ -z "$BASE_VERSION_NAME" ]; then
            echo "Unable to read base version metadata from app/build.gradle" >&2
            exit 1
          fi
          if ! [[ "$GITHUB_RUN_NUMBER" =~ ^[0-9]+$ ]] || [ "$GITHUB_RUN_NUMBER" -ge 100000 ]; then
            echo "GITHUB_RUN_NUMBER must be an integer below 100000" >&2
            exit 1
          fi
          CI_VERSION_CODE=$((BASE_VERSION_CODE * 100000 + GITHUB_RUN_NUMBER))
          if [ "$CI_VERSION_CODE" -gt 2100000000 ]; then
            echo "Computed versionCode exceeds Android's limit" >&2
            exit 1
          fi
          CI_VERSION_NAME="${BASE_VERSION_NAME}-build.${GITHUB_RUN_NUMBER}"
          {
            echo "base_name=${BASE_VERSION_NAME}"
            echo "name=${CI_VERSION_NAME}"
            echo "code=${CI_VERSION_CODE}"
            echo "tag=build-${GITHUB_RUN_NUMBER}"
          } >> "$GITHUB_OUTPUT"
          {
            echo "CI_VERSION_CODE=${CI_VERSION_CODE}"
            echo "CI_VERSION_NAME=${CI_VERSION_NAME}"
          } >> "$GITHUB_ENV"
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "${RUNNER_TEMP}/tapclick-release.jks"
          echo "KEYSTORE_FILE=${RUNNER_TEMP}/tapclick-release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease \
            --no-daemon \
            --stacktrace \
            --build-cache \
            -Dorg.gradle.jvmargs="-Xmx3072m -Dfile.encoding=UTF-8"

      - name: Verify signature and prepare release files
        id: dist
        env:
          SIGNING_CERT_SHA256: ${{ secrets.SIGNING_CERT_SHA256 }}
        run: |
          mkdir -p dist
          METADATA="app/build/outputs/apk/release/output-metadata.json"
          if [ ! -f "$METADATA" ]; then
            echo "Release output metadata is missing" >&2
            exit 1
          fi
          ACTUAL_VERSION_CODE=$(jq -r '.elements[0].versionCode // empty' "$METADATA")
          ACTUAL_VERSION_NAME=$(jq -r '.elements[0].versionName // empty' "$METADATA")
          if [ "$ACTUAL_VERSION_CODE" != "$CI_VERSION_CODE" ] || [ "$ACTUAL_VERSION_NAME" != "$CI_VERSION_NAME" ]; then
            echo "Release version metadata does not match the requested CI version" >&2
            exit 1
          fi
          mapfile -t APKS < <(find app/build/outputs/apk/release -maxdepth 1 -type f -name "*.apk")
          if [ "${#APKS[@]}" -ne 1 ]; then
            echo "Expected exactly one release APK, found ${#APKS[@]}" >&2
            exit 1
          fi
          SRC="${APKS[0]}"
          if [[ "$SRC" == *unsigned* ]]; then
            echo "Refusing to publish an unsigned APK" >&2
            exit 1
          fi
          DEST="dist/TapClick-${{ steps.version.outputs.name }}-universal.apk"
          cp "$SRC" "$DEST"
          APKSIGNER="${ANDROID_HOME}/build-tools/36.0.0/apksigner"
          "$APKSIGNER" verify --verbose --print-certs "$DEST"
          ACTUAL_CERT=$("$APKSIGNER" verify --print-certs "$DEST" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1 | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')
          EXPECTED_CERT=$(printf '%s' "$SIGNING_CERT_SHA256" | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')
          if [ -z "$ACTUAL_CERT" ] || [ "$ACTUAL_CERT" != "$EXPECTED_CERT" ]; then
            echo "Release signing certificate fingerprint mismatch" >&2
            exit 1
          fi
          APK_FILE=$(basename "$DEST")
          (cd dist && sha256sum "$APK_FILE" > "${APK_FILE}.sha256")
          echo "apk=${DEST}" >> "$GITHUB_OUTPUT"

      - name: Upload signed release artifact
        uses: actions/upload-artifact@v4
        with:
          name: TapClick-${{ steps.version.outputs.name }}-release
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: TapClick ${{ steps.version.outputs.base_name }} build ${{ github.run_number }}
          body: |
            ## TapClick ${{ steps.version.outputs.name }}

            - APK: universal
            - versionCode: `${{ steps.version.outputs.code }}`
            - Commit: `${{ github.sha }}`
            - Actions: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            - Signature and SHA-256 checksum verified by CI
          files: dist/*
          draft: false
          prerelease: false
          generate_release_notes: true
          make_latest: true
          overwrite_files: true
          fail_on_unmatched_files: true

      - name: Remove temporary keystore
        if: ${{ always() }}
        run: rm -f "${RUNNER_TEMP}/tapclick-release.jks"
